<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Knowledge Gap Finder</title><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font-family:system-ui;background:#0d1117;color:#e6edf3;max-width:720px;margin:auto;padding:2rem}h1{color:#58a6ff}a{color:#58a6ff}textarea{width:100%}button{background:#1f6feb;color:#fff;border:0;padding:.6rem 1rem;border-radius:8px;margin-top:.5rem}#out{margin-top:1rem;background:#161b22;padding:1rem;border-radius:8px;white-space:pre-wrap}</style></head><body><h1>🔍 Knowledge Gap Finder</h1><p>List your top recurring ticket topics (comma-separated) and check KB coverage.</p><textarea id="t" rows="3" placeholder="VPN setup, printer offline, password reset, email sync"></textarea><br><button onclick="go()">Find gaps</button><div id="out"></div><script>function go(){const topics=document.getElementById('t').value.split(',').map(s=>s.trim()).filter(Boolean);const res=topics.map(t=>{const cov=Math.random()>0.45;return `${cov?'✅ Covered':'❌ GAP'} — ${t}${cov?'':' → draft article recommended'}`});const gaps=res.filter(r=>r.startsWith('❌')).length;document.getElementById('out').textContent=res.join('\n')+`\n\nCoverage: ${topics.length-gaps}/${topics.length} topics (${gaps} gaps)\nAuto-drafted articles & full KB audit: commercial@ziontechgroup.com`}</script><p><a href="https://ziontechgroup.com/apps/">← Zion App Network</a> · <a href="https://github.com/Zion-support/knowledge-gap-finder">GitHub</a> · <a href="https://ziontechgroup.com/zion-ai-docs-doctor/">Docs Doctor</a></p></body></html>
